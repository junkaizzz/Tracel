[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracel"
version = "0.1.0"
description = "Reference-guided transcript-to-cell assignment for spatial transcriptomics with two-stage optimal transport"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Junkai Zhang" }, { name = "Hao Chen" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "anndata",
    "scanpy",
    "jax",
    "ott-jax",
    "moscot",
]

[project.scripts]
tracel = "tracel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
